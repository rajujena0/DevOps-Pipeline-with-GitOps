name: Build and Deploy to EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-app
  CLUSTER_NAME: devops-fargate-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to ECR
      run: |
        aws ecr get-login-password --region $AWS_REGION | \
        docker login --username AWS --password-stdin 118688039965.dkr.ecr.us-east-1.amazonaws.com

    - name: Build image
      run: docker build -t devops-app .

    - name: Tag image
      run: |
        docker tag devops-app:latest 118688039965.dkr.ecr.us-east-1.amazonaws.com/devops-app:latest

    - name: Push image
      run: |
        docker push 118688039965.dkr.ecr.us-east-1.amazonaws.com/devops-app:latest

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

    - name: Deploy to EKS
      run: |
        kubectl apply -f k8s/
        kubectl rollout restart deployment devops-app -n devops
